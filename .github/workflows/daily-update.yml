# Refreshes Fin Pro's data from NSE every trading day and republishes the
# site to GitHub Pages (gh-pages branch).
#
# State between runs: the SQLite database is kept, gzipped, as an asset on
# the "db-latest" release. The very first run starts from seed/finpro.db.gz.

name: Daily data update

on:
  schedule:
    # 14:00 UTC = 19:30 IST, Monday to Friday, after NSE publishes the
    # day's bhavcopy. GitHub may start scheduled runs a little late.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to re-enable this workflow (see "Keep schedule alive").
  actions: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      GH_TOKEN: ${{ github.token }}
      DB_RELEASE: db-latest

    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow through the API resets that
      # clock without needing a commit.
      - name: Keep schedule alive
        continue-on-error: true
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily-update.yml/enable"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check NSE is reachable
        run: python scripts/check_nse.py

      - name: Restore database
        run: |
          if gh release download "$DB_RELEASE" --pattern finpro.db.gz --dir /tmp; then
            echo "Restored database from release $DB_RELEASE"
            python scripts/db_archive.py unpack /tmp/finpro.db.gz finpro.db
          else
            echo "No saved database yet; starting from the seed"
            python scripts/db_archive.py unpack seed/finpro.db.gz finpro.db
          fi

      - name: Update data from NSE
        run: python -m backend.app.update

      - name: Save database
        run: |
          python scripts/db_archive.py pack finpro.db /tmp/finpro.db.gz

          if ! gh release view "$DB_RELEASE" > /dev/null 2>&1; then
            gh release create "$DB_RELEASE" \
              --title "Database snapshot" \
              --notes "Latest Fin Pro database, replaced by every daily update. Not a software release." \
              --latest=false
          fi

          gh release upload "$DB_RELEASE" /tmp/finpro.db.gz --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          # One commit, no history, so daily data never accumulates.
          force_orphan: true
          commit_message: "Deploy site (data update)"
